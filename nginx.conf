events {
    worker_connections 1024;
}

http {
    # Указываем DNS-резолвер — Docker встроенный
    resolver 127.0.0.11 valid=5s;

    # Кэш DNS, чтобы не перезапрашивать
    resolver_timeout 5s;

    server {
        listen 80;
        server_name localhost;

        # 1. Запросы к API (бэкенд)
        location /api/ {
            # Используем переменную для динамического разрешения
            set $backend http://backend:5000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Все остальные запросы (фронтенд)
        location / {
            # Используем переменную для динамического разрешения
            set $frontend http://frontend:80;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}