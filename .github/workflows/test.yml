name: Run Backend and Worker Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: Worker
            path: worker
            requirements: worker/requirements.txt
            test: worker/test_tasks.py
            cov: tasks
          - name: Backend
            path: backend
            requirements: backend/requirements.txt
            test: backend/test_app.py
            cov: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies for ${{ matrix.component.name }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r ${{ matrix.component.requirements }}

      - name: Run tests for ${{ matrix.component.name }}
        run: |
          cd ${{ matrix.component.path }} && \
          python -m pytest ${{ matrix.component.test }} -v --cov=${{ matrix.component.cov }} --cov-report=term